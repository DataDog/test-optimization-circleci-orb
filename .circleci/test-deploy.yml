version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.0.4
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  test-optimization-circleci-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

commands:
  # tests/go-check.sh needs Bash and curl, which golang images have, and
  # Python for its local stand-in for the intake.
  go-check-prepare:
    parameters:
      layout:
        type: string
        default: root
    steps:
      - checkout
      - run:
          name: Install Python for the intake
          command: |
            if ! command -v python3 >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq python3 >/dev/null
            fi
      - run: echo 'export DD_API_KEY=dummy' >> "$BASH_ENV"
      - run:
          name: Write the Go modules and record the image's go
          command: tests/go-check.sh prepare << parameters.layout >>
  go-check:
    parameters:
      expect_go:
        type: string
      expect_ddtest_version:
        type: string
        default: ''
    steps:
      - run:
          name: Run go test in a later step, which gets the orb's BASH_ENV
          command: tests/go-check.sh check << parameters.expect_go >> << parameters.expect_ddtest_version >>

jobs:
  # The orb's default go_tracer_version, in a step of its own; go test runs
  # in a later step, as users run it. See tests/go-check.sh.
  go-command-test:
    parameters:
      image:
        type: string
      expect_go:
        type: string
        default: instrumented
    docker:
      - image: << parameters.image >>
    steps:
      - go-check-prepare
      - test-optimization-circleci-orb/autoinstrument:
          languages: go
      - go-check:
          expect_go: << parameters.expect_go >>
          expect_ddtest_version: default

  # An explicit go_tracer_version: a ddtest release, or an Orchestrion version,
  # which names no ddtest release and installs the latest.
  go-version-test:
    parameters:
      go_tracer_version:
        type: string
      expect_ddtest_version:
        type: string
    docker:
      - image: golang:1.25
    steps:
      - go-check-prepare
      - test-optimization-circleci-orb/autoinstrument:
          languages: go
          go_tracer_version: << parameters.go_tracer_version >>
      - go-check:
          expect_go: instrumented
          expect_ddtest_version: << parameters.expect_ddtest_version >>

  # Two modules below the root, with the deprecated python_coverage_version set.
  go-deprecated-parameter-test:
    docker:
      - image: golang:1.25
    steps:
      - go-check-prepare:
          layout: multiple_modules
      - test-optimization-circleci-orb/autoinstrument:
          languages: go
          python_coverage_version: '7.13.5'
      - go-check:
          expect_go: instrumented
          expect_ddtest_version: default

  # Test that the autoinstrumentation command orb works as expected.
  command-test:
    docker:
      - image: adoptopenjdk/openjdk11:jdk-11.0.27_6
    steps:
      - checkout
      # You can pass environment variables at runtime like so
      - run: echo 'export DD_API_KEY=dummy' >> $BASH_ENV
      - test-optimization-circleci-orb/autoinstrument:
          languages: java
          java_instrumented_build_system: all
      - run:
          name: Test that java has been instrumented with test visibility
          command: |
            java -version 2>&1 | tee $LOG_FILE
            grep -q "$TRACER_INIT_LOG" $LOG_FILE || { echo "Error: Output does not contain tracer initialisation log: $TRACER_INIT_LOG"; exit 1; }
          environment:
            DD_SERVICE: my-service
            LOG_FILE: java-output.log
            TRACER_INIT_LOG: CI Visibility settings
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - go-command-test:
          name: go-command-test-golang-1-25
          image: golang:1.25
          filters: *filters
      - go-command-test:
          name: go-command-test-golang-1
          image: golang:1
          filters: *filters
      # ddtest needs Go 1.25: the orb skips Go with a warning and the job continues.
      - go-command-test:
          name: go-command-test-skip-golang-1-24
          image: golang:1.24
          expect_go: skipped
          filters: *filters
      - go-version-test:
          name: go-version-test-v1-16-0
          go_tracer_version: v1.16.0
          expect_ddtest_version: v1.16.0
          filters: *filters
      - go-version-test:
          name: go-version-test-orchestrion-v1-8-0
          go_tracer_version: v1.8.0
          expect_ddtest_version: latest
          filters: *filters
      - go-deprecated-parameter-test:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: datadog/test-optimization-circleci-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - go-command-test-golang-1-25
            - go-command-test-golang-1
            - go-command-test-skip-golang-1-24
            - go-version-test-v1-16-0
            - go-version-test-orchestrion-v1-8-0
            - go-deprecated-parameter-test
          context: orb-publishing
          filters: *release-filters
