description: >
  Installs Datadog tracers for configured languages and enables Test Visibility.
parameters:
  languages:
    description: 'List of languages to be instrumented. Can be either "all" or any of "java", "js", "python", "dotnet", "ruby", "go" (multiple languages can be specified as a space-separated list).'
    type: string
  service:
    description: 'The name of the service or library being tested.'
    type: string
    default: ''
  site:
    description: 'Datadog site (optional). See https://docs.datadoghq.com/getting_started/site for more information about sites.'
    type: string
    default: datadoghq.com
  dotnet_tracer_version:
    description: 'The version of Datadog .NET tracer to use (optional). Defaults to the version pinned by this orb release.'
    type: string
    default: '3.55.1'
  java_tracer_version:
    description: 'The version of Datadog Java tracer to use (optional). Defaults to the version pinned by this orb release.'
    type: string
    default: '1.67.1'
  js_tracer_version:
    description: 'The version of Datadog JS tracer to use (optional). Defaults to the version pinned by this orb release.'
    type: string
    default: '6.21.0'
  python_tracer_version:
    description: 'The version of Datadog Python tracer to use (optional). Defaults to the version pinned by this orb release.'
    type: string
    default: '4.15.6'
  ruby_tracer_version:
    description: 'The version of datadog-ci gem to use (optional). Defaults to the version pinned by this orb release.'
    type: string
    default: '1.42.0'
  go_tracer_version:
    description: >-
      The version of ddtest (https://github.com/DataDog/ddtest), which instruments Go tests, to use (optional); v1.14.0 is the oldest supported.
      A value that names no ddtest release from v1.14.0 on, such as an earlier Orchestrion version, installs the latest ddtest with a warning.
      Defaults to the version pinned by this orb release.
    type: string
    default: 'v1.16.0'
  python_coverage_version:
    description: 'Deprecated, has no effect: the Python tracer no longer needs the coverage package, and the orb no longer installs it.'
    type: string
    default: ''
  java_instrumented_build_system:
    description: 'If provided, only the specified build systems will be instrumented (allowed values are `gradle` and `maven`). Otherwise every Java process will be instrumented.'
    type: string
    default: ''
steps:
  - run:
      environment:
        SERVICE: <<parameters.service>>
        SITE: <<parameters.site>>
        DD_CIVISIBILITY_INSTRUMENTATION_LANGUAGES: <<parameters.languages>>
        DD_SET_TRACER_VERSION_DOTNET: <<parameters.dotnet_tracer_version>>
        DD_SET_TRACER_VERSION_JAVA: <<parameters.java_tracer_version>>
        DD_SET_TRACER_VERSION_JS: <<parameters.js_tracer_version>>
        DD_SET_TRACER_VERSION_PYTHON: <<parameters.python_tracer_version>>
        DD_SET_TRACER_VERSION_RUBY: <<parameters.ruby_tracer_version>>
        DD_SET_TRACER_VERSION_GO: <<parameters.go_tracer_version>>
        PYTHON_COVERAGE_VERSION: <<parameters.python_coverage_version>>
        DD_INSTRUMENTATION_BUILD_SYSTEM_JAVA: <<parameters.java_instrumented_build_system>>
        INSTALLATION_SCRIPT_URL: https://install.datadoghq.com/scripts/install_test_visibility_v16.sh
        INSTALLATION_SCRIPT_CHECKSUM: c17d89e4e0d2bbfb717217e05f7e64fb0f9c463a1836e46151080b1a6c621ea9
      name: Configure Datadog Test Visibility
      command: <<include(scripts/autoinstrument.sh)>>
